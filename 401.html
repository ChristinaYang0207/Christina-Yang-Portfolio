  <script>
  document.addEventListener("DOMContentLoaded", function () {
    const text = "A Pittsburgh-based UX/UI designer dedicated to creating innovative and user-friendly digital experiences.";
    const speed = 50; // Typing speed in ms
    let index = 0;
    function type() {
      if (index < text.length) {
        document.getElementById("typing-text").textContent += text.charAt(index);
        index++;
        setTimeout(type, speed);
      } else {
        document.getElementById("typing-text").style.borderRight = "none"; // Remove cursor at the end
      }
    }
    type();
  });
</script>
